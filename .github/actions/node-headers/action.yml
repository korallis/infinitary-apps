name: Local Node headers
description: Find the headers shipped beside Node for a Linux install of a source that still builds the database module as it installs.
inputs:
  working-directory:
    description: Checkout about to be installed.
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # pnpm filters lowercase npm_* from lifecycle scripts; callers use
        # node-gyp's case-insensitive NPM_PACKAGE_CONFIG_NODE_GYP_* settings.
        #
        # A workflow given its source by a ref of its own can be handed a
        # release from before pnpm-workspace.yaml kept better-sqlite3's build
        # off. Such a source starts node-gyp as it installs and must find the
        # headers here; one that keeps the build off compiles nothing and
        # needs none. sqlite-build-off.mjs takes that setting only from the
        # list pnpm reads it from, and counts a source as still building
        # wherever the file leaves a doubt.
        if [[ "$RUNNER_OS" == Linux ]] &&
          ! node "$GITHUB_ACTION_PATH/sqlite-build-off.mjs" pnpm-workspace.yaml; then
          node_root="$(bash "$GITHUB_ACTION_PATH/root.sh")"
          printf 'INFINITARY_NODE_HEADERS=%s\n' "$node_root" >> "$GITHUB_ENV"
        fi
