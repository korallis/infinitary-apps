name: ci

# A pushed task branch and a pull request run the branch check as three
# Linux jobs side by side (INF-5577's review, the captain's pick "Split the
# branch check into three jobs that run side by side"), each from its own
# install:
# - code checks: the release notes, the phone contract flag, typecheck and
#   the lint;
# - the tests a change reaches: the edited unit and integration tests and
#   the unit, integration and browser tests that read a changed file, and
#   every browser test when a version touches the renderer or its browser
#   tests;
# - the build and the one critical-path journey (INF-2507).
# Before the split these were one job's steps (INF-2915's plan, the captain's
# direction B); the check runs the same steps, so the longest of the three
# sets its time instead of their sum. A change whose tests hold more measured
# time than one part takes runs the parts past the first in a fourth job, one
# machine per part, once the code checks have counted them (INF-5493).
# A version whose every path is a test, docs, the docs site, a release note or
# the phone app
# skips the build and the critical path (scripts/pr-paths.ts). The swept
# batch runs everything before a change reaches main (docs/testing.md, "What
# a pull request runs"). Edited unit files run three total rounds locally,
# never in extra PR repeat jobs, and once more here beside the tests that read
# a changed file. Full unit, integration and probe sweeps run here only on
# request, never on PRs.
# A change here is a pushed task branch with no pull request of its own
# (docs/forge.md, "Batches of your own"), so each push of a task's branch,
# named inf/* by the naming runbook's words or fm/task-* from before, starts
# these jobs, measured from the commit the branch left main at. A branch built
# on a batch's version, as a held batch's repair is, skips every step after
# finding that version and passes in about a minute: the batch's own run
# checks it with every change beside it once it joins, the release notes
# included (docs/testing.md, "A pushed branch"). A pull request runs the same
# jobs on its merge commit: another person's, or a task's own from before it.
# A batch pull request skips them, since batch-pull-request.yml runs the swept
# batch on that version.
# A push to main starts none of these jobs (INF-2340): main.yml's full check
# runs the same commands in verify.yml's linux-checks lane and its Linux test
# groups, every probe included.
# Which Linux machines (INI-9's plan, approved by the captain): every job
# runs on the label the repository variable LINUX_RUNNER names - the
# placement service's shell-pc-linux, a fresh VM per job on the Windows PC,
# five at once - and on GitHub's hosted ubuntu-24.04 when it is unset.
# The repository variable LINUX_QUEUES (DOP-251's plan) can send a job's
# kind to another queue, such as the Mac mini's Linux guests, before
# LINUX_RUNNER; a kind it leaves out keeps the label above (docs/testing.md,
# "Each Linux job's kind"). The branch check's jobs share the `typecheck`
# kind, which the project's own home leaves out of LINUX_QUEUES, so they run
# on hosted Ubuntu (INF-6330's plan).
# Self-hosted images supply Node 24 and their own
# pnpm store (DOP-67/68), so only GitHub-hosted jobs restore setup-node's
# pnpm cache (DOP-66 fix 1).
# An outside contributor's pull request (docs/public-ci.md, "Outside
# contributors") runs only on GitHub's own machines, whatever the variables
# say: these jobs on hosted Ubuntu, and contributors.yml's run of the swept
# batch's tests, its edited journeys' rounds and its Windows build on hosted
# Ubuntu, Mac and Windows. The fresh
# Windows 11 check waits for the next alpha's release check; the signed
# installer checks, signing and TestFlight run only from main. A pull request runs the
# check files it carries, so the owner's approval of each run, not this
# routing, keeps a contributor off the project's machines.

on:
  # Linux-only branch validation; edited unit-file rounds belong locally.
  workflow_dispatch:
    inputs:
      sweep:
        description: Also run the unit, integration and probe sweeps (default - code and build only)
        required: false
        type: boolean
        default: false
  # Each push of a task's branch; the app's own batch branches
  # (infinitary-batch/*) and main start nothing here.
  push:
    branches:
      - "inf/**"
      - "fm/task-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The branch check's three jobs run on every pushed task branch and pull
# request, including release notes, and each stops after its base step on a
# branch built on a batch's version. A request runs the code checks and the
# build. Full sweeps run only on a request: a push and a pull request name no
# sweep, so those jobs skip at the job boundary.
# Each test step ends at 30 minutes (INF-1083, the captain's choice for unit
# tests): a stuck test or wait ends sooner, by its own cap of at most 10
# minutes (docs/test-cohorts.md, "Budgets"), and these steps take about two.
jobs:
  # Each job's name leads with what started it (scripts/ci-job-names.mjs).
  # Each of the three skips a batch pull request: the exact pull requests
  # whose checks batch-pull-request.yml starts, a batch branch of this
  # repository itself into the default branch, which the swept batch checks
  # whole. Each starts on its own, with no `needs`, so none waits for another;
  # only reached-tests-parts waits, for the code checks' count of its parts.
  code-checks:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'infinitary-batch/') && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == github.event.repository.default_branch) }}
    name: ${{ github.event_name == 'pull_request' && 'Pull request · Code checks (Linux)' || github.event_name == 'push' && 'Branch push · Code checks (Linux)' || 'Manual request · Code checks (Linux)' }}
    # An outside contributor's pull request takes hosted Ubuntu before any variable.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').typecheck || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      # The parts of the tests a change reaches past the first, which
      # reached-tests-parts runs; empty when they take one part.
      reach-parts: ${{ steps.reach-parts.outputs.later }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The pull request's merge commit and its base parent, for the notes
          # step. A pushed branch has no merge commit, so it fetches every
          # commit to find the one it left main at.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
      # Where the change starts, for the notes and phone flag steps here, and
      # the paths, reader and critical-path steps of the other two jobs, which
      # each find it the same way: the base parent of a pull request's merge
      # commit, and for a pushed branch the commit it left main at, so main's
      # newer commits are never read as the branch's own changes. A pushed
      # branch built on a batch's version, as a held batch's repair is,
      # starts at the newest such version instead (INF-5379's plan, piece 2)
      # and names it as the step's `batch` output. Every later step skips on
      # it, so the check passes in about a minute: the batch's own run checks
      # the branch with every change beside it once it joins, its release
      # notes and phone contract flag included (batch-checks.yml's notes job;
      # docs/testing.md, "A pushed branch"). The full checkout fetches every
      # batch branch; a pull request's fetches none, so it never skips. Plain
      # git, so it runs before anything is set up.
      - name: Find the change's base
        id: base
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/change-base
        with:
          from: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}
      - uses: ./.github/actions/pnpm
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ steps.base.outputs.batch == '' }}
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # A change adds its release note or exclusion and the ledger stays
      # consistent (docs/release-notes.md "The release check"). Plain Node, no
      # install, under a second, so a miss fails here instead of at the alpha.
      - name: Release notes
        if: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.batch == '' }}
        run: node scripts/release-notes.ts change --base "$CHANGE_BASE"
      # A change may not grow a code file past the size check's warning line,
      # or further past it, so two changes cannot together pass the ceiling
      # in a merge batch (docs/testing.md, "The size check's headroom").
      # Plain Node, no install.
      - name: Size headroom
        if: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.batch == '' }}
        run: node scripts/file-sizes.ts --headroom --base "$CHANGE_BASE"
      # A change that moves the contract's major or view floor is flagged
      # with the phone build the next alpha waits for (docs/testing.md, "What
      # a task branch requests"; INF-4500). Plain Node, never fails.
      - name: Phone contract flag
        if: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.batch == '' }}
        run: node scripts/phone-contract-flag.ts --base "$CHANGE_BASE"
      - uses: ./.github/actions/electron-download
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.base.outputs.batch == '' }}
      # How many parts the tests this change reaches take, each at most 900
      # measured seconds (scripts/unit-repeats.ts, REACH_PART_SECONDS), so a
      # wide change's reader step ends inside its limit on a slow machine as
      # on a quick one (INF-5493). reached-tests runs the first part at once;
      # this step names the others, which reached-tests-parts starts when
      # this job ends. A few seconds, before the typecheck, so a typecheck
      # or lint failure still lets every part run.
      - name: Count the parts of the tests a change reaches
        id: reach-parts
        if: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.batch == '' }}
        run: node scripts/unit-repeats.ts --reach --base "$CHANGE_BASE" --later-parts
      - run: pnpm typecheck
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm check
        if: ${{ steps.base.outputs.batch == '' }}
      # The adherence lint caught nothing on 372 pull request runs (INF-2915's
      # plan), so it runs on a request, as main's check does, and before each
      # push in pnpm check:changed, never on a pull request or a pushed branch.
      - run: pnpm lint:adherence
        if: ${{ github.event_name == 'workflow_dispatch' }}

  # The tests a change reaches. A request runs none: its sweep, when it asks
  # for one, is the jobs further down.
  reached-tests:
    if: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'infinitary-batch/') && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == github.event.repository.default_branch) }}
    name: ${{ github.event_name == 'pull_request' && 'Pull request · Tests a change reaches (Linux)' || 'Branch push · Tests a change reaches (Linux)' }}
    # An outside contributor's pull request takes hosted Ubuntu before any variable.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').typecheck || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # As the code checks fetch, for the paths and reader steps.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
      # The code checks' step, which says why.
      - name: Find the change's base
        id: base
        uses: ./.github/actions/change-base
        with:
          from: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}
      - uses: ./.github/actions/pnpm
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ steps.base.outputs.batch == '' }}
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # What this version runs beyond its code checks (INF-2915's plan):
      # browser=true, every browser test, when one changed path is the
      # renderer or its browser tests. Plain Node, no install. Skipped, it
      # says nothing, so the browser tests skip too.
      - name: Changed paths
        id: paths
        if: ${{ steps.base.outputs.batch == '' }}
        run: node scripts/pr-paths.ts --base "$CHANGE_BASE"
      - uses: ./.github/actions/electron-download
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.base.outputs.batch == '' }}
      # Chromium, about 15 seconds, for the browser step, for a browser test
      # the next step runs and for an integration file it runs that starts
      # one, such as tests/run-temp-root.test.ts (the integration groups
      # install it too).
      - uses: ./.github/actions/browser-chromium
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: ./.github/actions/linux-test-tools
        if: ${{ steps.base.outputs.batch == '' }}
      # Each edited test file, and the unedited unit, integration and
      # browser tests that import or read each changed file, run once here
      # (scripts/unit-reach.ts directUnitReach), so a break the crewmate's
      # Mac rounds did not see fails the pull request, not the merge batch or
      # main's full check (INF-2478, INF-2999; INF-3690's gap 3 for edited
      # files, whose three rounds stay local). A probe, an unedited
      # Mac-listed reader, or a browser file when the browser step runs every
      # one, is listed with the run that owns it, and a selected file that
      # did not run fails it. A selection wider than 100 files runs as
      # several Vitest runs one after another, each with fresh workers, so an
      # in-memory worker's memory stays inside this runner's (INF-4163).
      # A selection holding more measured time than one part runs here only
      # its first part, and reached-tests-parts runs the others (INF-5493).
      - name: Unit, integration and browser tests that read a changed file
        if: ${{ steps.base.outputs.batch == '' }}
        run: node scripts/unit-repeats.ts --reach --base "$CHANGE_BASE" --part 1 --run
        timeout-minutes: 30
      # The browser layer (docs/testing.md, "The browser layer"): every
      # browser file, about three minutes, when the version touches the
      # renderer or its browser tests; otherwise the step before runs the
      # browser files that read a changed file. A requested sweep runs them
      # in unit-tests, and the swept batch on every approved change.
      - name: Browser tests
        if: ${{ steps.paths.outputs.browser == 'true' }}
        run: pnpm test --project browser
        timeout-minutes: 30

  # The parts past the first of the tests a change reaches, one machine per
  # part, when the code checks counted more than one (INF-5493): a change to
  # the shared orchestrator and forge files reached 334 files, which one
  # machine ran in about 20 minutes and, on a slower one, not inside the
  # step's 30. Each part finds the change's base and its selection as
  # reached-tests does and runs the part the matrix names, failing if it
  # counts the parts otherwise. It skips with the code checks, on a request,
  # on a branch built on a batch's version and on a change whose tests take
  # one part, which is most.
  reached-tests-parts:
    needs: code-checks
    if: ${{ !cancelled() && needs.code-checks.outputs.reach-parts != '' }}
    name: ${{ format('{0} · Tests a change reaches (Linux; part {1}/{2})', github.event_name == 'pull_request' && 'Pull request' || 'Branch push', matrix.part, matrix.parts) }}
    # An outside contributor's pull request takes hosted Ubuntu before any variable.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').typecheck || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      # Every part runs, so one push shows each failing reader.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.code-checks.outputs.reach-parts) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # As the code checks fetch, for the reader step.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
      # The code checks' step, which says why.
      - name: Find the change's base
        id: base
        uses: ./.github/actions/change-base
        with:
          from: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}
      - uses: ./.github/actions/pnpm
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ steps.base.outputs.batch == '' }}
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/electron-download
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.base.outputs.batch == '' }}
      # As reached-tests installs them, for the browser and integration
      # files a part runs.
      - uses: ./.github/actions/browser-chromium
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: ./.github/actions/linux-test-tools
        if: ${{ steps.base.outputs.batch == '' }}
      # reached-tests's step, on this machine's part.
      - name: Unit, integration and browser tests that read a changed file
        if: ${{ steps.base.outputs.batch == '' }}
        env:
          PART: ${{ matrix.part }}/${{ matrix.parts }}
        run: node scripts/unit-repeats.ts --reach --base "$CHANGE_BASE" --part "$PART" --run
        timeout-minutes: 30

  # The build and the critical path. A request builds; a change builds only
  # when the paths step says so.
  build:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'infinitary-batch/') && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == github.event.repository.default_branch) }}
    name: ${{ github.event_name == 'pull_request' && 'Pull request · Build and critical path (Linux)' || github.event_name == 'push' && 'Branch push · Build and critical path (Linux)' || 'Manual request · Build (Linux)' }}
    # An outside contributor's pull request takes hosted Ubuntu before any variable.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').typecheck || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # As the code checks fetch, for the paths and critical-path steps.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
      # The code checks' step, which says why.
      - name: Find the change's base
        id: base
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/change-base
        with:
          from: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}
      - uses: ./.github/actions/pnpm
        if: ${{ steps.base.outputs.batch == '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ steps.base.outputs.batch == '' }}
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # build=false when every changed path is a test, docs, a release note
      # or the phone app (INF-2915's plan). Plain Node, no install. Skipped,
      # it says nothing, so the build and the critical path skip too.
      - name: Changed paths
        id: paths
        if: ${{ github.event_name != 'workflow_dispatch' && steps.base.outputs.batch == '' }}
        run: node scripts/pr-paths.ts --base "$CHANGE_BASE"
      - uses: ./.github/actions/electron-download
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.base.outputs.batch == '' }}
      - run: pnpm build
        if: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.build == 'true' }}
      # The critical path (INF-2480's plan, captain: "path six-steps (launch,
      # sign in, project, first mate, crewmate card, merge)"; INF-2507): the
      # one journey every change that builds the app runs, on the app just
      # built from the pushed branch's version or the pull request's merge
      # commit, on the Linux desktop
      # (docs/testing.md, "The critical path"). A change that edits it runs
      # it three rounds and alone, as any edited journey.
      - uses: ./.github/actions/linux-desktop
        if: ${{ github.event_name != 'workflow_dispatch' && steps.paths.outputs.build == 'true' }}
      - name: Critical-path journey
        id: critical-path
        if: ${{ github.event_name != 'workflow_dispatch' && steps.paths.outputs.build == 'true' }}
        # The journey ends at 75 minutes and its command at 90 (INF-1083,
        # the captain's check limits, as journeys.yml).
        timeout-minutes: 90
        run: scripts/on-screen.sh node scripts/journey-runs.ts --base "$CHANGE_BASE" --files tests/e2e/critical-path.spec.ts --alone-out playwright-report/alone -- --project=desktop
        env:
          INFINITARY_SOURCE_EVIDENCE: ${{ runner.temp }}/source-desktop-evidence
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/source-results.json
          INFINITARY_E2E_RUN_MINUTES: 75
          SCREEN: 2560x1600x24
      # The window's frozen method list (INF-6748's velocity review, the
      # captain's pick): its exact-keys check broke three batch rounds in two
      # days when a change added a method and no branch check ran it. It runs
      # here in its own lane, the application project, which --project=desktop
      # above leaves out.
      - name: Window methods journey
        id: window-methods
        if: ${{ github.event_name != 'workflow_dispatch' && steps.paths.outputs.build == 'true' }}
        timeout-minutes: 30
        run: scripts/on-screen.sh node scripts/journey-runs.ts --base "$CHANGE_BASE" --files tests/e2e/phase0-guardrails.spec.ts --alone-out playwright-report/alone-window-methods
        env:
          INFINITARY_SOURCE_EVIDENCE: ${{ runner.temp }}/source-desktop-evidence-window-methods
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/window-methods-results.json
          INFINITARY_E2E_RUN_MINUTES: 25
          SCREEN: 2560x1600x24
      # Linux runs every test it can (docs/testing.md, "Tests that need a
      # Mac"): a test that skipped here without MAC_ONLY_TAG fails the job.
      - name: Refuse a test that skipped on Linux without the Mac tag
        if: ${{ !cancelled() && (steps.critical-path.outcome == 'success' || steps.critical-path.outcome == 'failure') }}
        run: node scripts/untagged-skips.ts playwright-report/source-results.json
      - name: Refuse a window methods test that skipped on Linux without the Mac tag
        if: ${{ !cancelled() && (steps.window-methods.outcome == 'success' || steps.window-methods.outcome == 'failure') }}
        run: node scripts/untagged-skips.ts playwright-report/window-methods-results.json
      - name: Keep the Linux window and the journey's results
        if: ${{ always() && (steps.critical-path.outcome == 'failure' || steps.window-methods.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-desktop-critical-path
          path: |
            ${{ runner.temp }}/source-desktop-evidence/
            ${{ runner.temp }}/source-desktop-evidence-window-methods/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  # The in-memory cohorts and the browser layer (docs/test-cohorts.md).
  unit-tests:
    if: github.event_name != 'pull_request' && inputs.sweep
    name: Manual request · Unit tests (Linux)
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
      # The browser layer (docs/testing.md, "The browser layer").
      - uses: ./.github/actions/browser-chromium
      - run: pnpm test --project pure --project unit --project unit-isolated --project browser
        timeout-minutes: 30

  # The integration cohort, split by vitest's own --shard (a hash of each
  # file's path), on machines of their own so nothing else loads the host
  # its budgets measure. Each shard reports even when the other fails.
  integration-tests:
    if: github.event_name != 'pull_request' && inputs.sweep
    name: ${{ format('Manual request · Integration tests (Linux; group {0}/{1})', matrix.shard, strategy.job-total) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
      # The run-root regression starts real Vitest Chromium too.
      - uses: ./.github/actions/browser-chromium
      - uses: ./.github/actions/linux-test-tools
      - run: pnpm test --project integration --shard="$SHARD/$SHARDS"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        timeout-minutes: 30

  # Probes can fail with no code change (docs/test-cohorts.md, "Probes").
  # Run every probe on request, never a changed-path selection.
  probe-tests:
    if: github.event_name != 'pull_request' && inputs.sweep
    name: Manual request · Environment checks (Linux)
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project probe
        timeout-minutes: 30
