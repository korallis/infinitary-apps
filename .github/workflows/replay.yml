name: replay

# INF-800: the replay gate alone, on request for any branch
# (docs/replay-harness.md, "The gate"). It reads no Mac, so it runs on hosted
# Linux and takes no Mac mini runner. Every alpha still runs it inside
# verify.yml's mac lane.

on:
  workflow_dispatch:

permissions:
  contents: read

# A newer request for the same branch replaces the older one.
concurrency:
  group: replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-gate:
    name: Manual request · First mate replay checks
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # The path every crewmate works under (journeys.yml says why).
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Application Support/firstmate
          persist-credentials: false
      - uses: ./Application Support/firstmate/.github/actions/pnpm
        with:
          working-directory: Application Support/firstmate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: Application Support/firstmate/pnpm-lock.yaml
      - uses: ./Application Support/firstmate/.github/actions/electron-download
        with:
          working-directory: Application Support/firstmate
      - run: pnpm install --frozen-lockfile
      - run: pnpm replay:gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-report
          path: Application Support/firstmate/replay-report.json
          if-no-files-found: ignore
          retention-days: 14
