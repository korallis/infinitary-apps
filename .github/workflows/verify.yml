name: verify

# The full verification PR CI no longer pays for (captain decision B,
# 2026-09-15; scout fm3000-ci-release-only-s1): the unit gate and the
# Playwright e2e suite on hosted Linux, then Mac-specific unit files, the e2e
# suite, the replay gate and the universal package smoke on macOS. It runs
# inside every alpha before signing, on every push to main through main.yml
# (main's desktop release check, INF-2146), on an outside contributor's pull
# request on GitHub's machines alone (contributors.yml, the swept batch's
# selection), and on demand for any ref:
#
#   See docs/forge.md: manual full-system requests must opt in explicitly.
#
# Its lanes follow a profile (docs/alpha.md "The signed channel workflow"):
# stable and alpha both run the full Linux and Mac lanes. Stable
# promotions omit this workflow entirely, relying on their published alpha's run.
#
# A call names its part (INF-2480, the captain: "old set at the release check
# only, from the first piece on"): main.yml's call runs the checks part, every
# lane but the journeys, with only the tagged tests on the Mac; an alpha that
# reuses main's checks runs the journeys part, every journey on Linux and the
# Mac and nothing else; a request with mac_only runs the three Mac lanes and
# no Linux job (INF-2850); a request with linux_only runs every Linux job the
# swept batch runs - the code checks, every test group, every journey and the
# startup fixtures - and no Mac job (a change sent back from its batch,
# docs/testing.md "What a task branch requests"); every other run is the
# whole check.
#
# The e2e paint and latency budgets are graded only on request, on a quiet
# host (captain's B1, 2026-09-24; tests/e2e/perf.ts): every e2e run prints
# them, and `-f perf=true` adds a run of the @perf-tagged specs that holds
# them to their budgets. The same input holds linux-tests' vitest tests to
# their time limits, which no other run keeps (INF-857, docs/test-cohorts.md
# "Budgets").
#
# Deliberately no pull_request, push or schedule trigger of its own (captain's call;
# main.yml is the one caller that runs it on a push):
# the per-PR mac job was 98% of a ~$200/month bill. The Mac lanes' runner
# label comes from the split kind in the MAC_QUEUES repository variable,
# else MAC_RUNNER, so a self-hosted runner can take them over without a
# workflow change (docs/testing.md, "Each Mac job's kind and size"). A pull
# request runs no journeys (INF-2139); journeys.yml runs the ones a branch
# names on request: the whole suite stays here.

on:
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        default: ''
      ref:
        description: Branch, tag or SHA to verify (default - the caller's ref)
        required: false
        type: string
      mac_runner:
        description: Optional isolated Mac runner label for a proof run; unset keeps the project's runner
        required: false
        type: string
      native_runner:
        description: Optional Mac runner label for the native tests and parallel journeys alone, ahead of the native kind; unset keeps the project's runner
        required: false
        type: string
      # Only a call takes it: main.yml and release.yml set it, and a request
      # keeps LINUX_RUNNER (docs/testing.md, "A release's hosted machines").
      hosted:
        description: Run the Linux jobs on GitHub's hosted Ubuntu, whatever LINUX_RUNNER says
        required: false
        type: boolean
        default: false
      fleet_tests:
        description: Let the Linux test groups use LINUX_RUNNER even when other Linux jobs are hosted
        type: boolean
        default: false
      profile:
        description: Which lanes run - stable or alpha (both run the full checks)
        required: false
        type: string
        default: stable
      # Only a call takes it, as hosted (docs/testing.md, "Main's desktop release check").
      part:
        description: all (every lane), checks (no Linux journeys; the Mac's journeys follow all_journeys) or journeys (every journey on Linux and the Mac, nothing else)
        required: false
        type: string
        default: all
      # An alpha's, the swept batch's and an outside contributor's calls run
      # every journey on the Mac; main.yml's call runs the tagged ones.
      all_journeys:
        description: Run every journey on the Mac, not only the tests that need a Mac
        required: false
        type: boolean
        default: true
      # Only the swept batch's call takes it (batch-checks.yml).
      confirm:
        description: Confirm each failed Linux test group's failed test files, three rounds, once the test groups end
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_system:
        description: Explicitly request full Linux and Mac verification, including signing and packaging (not Linux-only)
        type: boolean
        default: false
      # The three Mac jobs alone, for a Mac-specific proof such as a Mac
      # runner's trial (INF-2850, the captain's pick from INF-2834: "Give a
      # manual check request a choice that runs only the Mac jobs").
      mac_only:
        description: Explicitly request only the Mac jobs (native tests, replay and package; parallel and desktop journeys), no Linux job
        type: boolean
        default: false
      # Every Linux job the swept batch runs, no Mac job: the proof a change
      # sent back from its batch passes before it goes back in line (INF-5097,
      # the captain's pick "Every Linux test and journey the batch runs").
      linux_only:
        description: Explicitly request only the Linux jobs the merge batch runs (code checks, every test group, every journey, startup fixtures), no Mac job
        type: boolean
        default: false
      task:
        description: Requesting task (required for manual full-system, Mac-only or Linux-only verification)
        type: string
      reason:
        description: Named full-run exception and why narrower proof cannot suffice
        type: string
      ref:
        description: Exact source commit for full-system, Mac-only or Linux-only; optional branch, tag or SHA for installer checks
        required: false
        type: string
      mac_runner:
        description: Optional isolated Mac runner label for a proof run; unset keeps the project's runner
        required: false
        type: string
      # A measuring run of the native tests and parallel journeys on another
      # Mac, such as macos-15, while the desktop journeys keep mac_runner's.
      native_runner:
        description: Optional Mac runner label for the native tests and parallel journeys alone, ahead of the native kind; unset keeps the project's runner
        required: false
        type: string
      profile:
        description: Which lanes run - stable or alpha (both run the full checks)
        required: false
        type: choice
        options:
          - stable
          - alpha
        default: stable
      installer_only:
        description: Run only the signed Mac installer and updater proof on disposable hosted Macs; publish nothing
        required: false
        type: boolean
        default: false
      installer_reuse:
        description: Select installer-only verification using a reviewed JSON declaration for existing signed copies; never silently rebuilds
        required: false
        type: string
        default: ''
      perf:
        description: Also grade the e2e paint and latency budgets and the unit tests' time limits (run this on a quiet host)
        required: false
        type: boolean
        default: false
      # A requested check runs only the tests that need a Mac there, since
      # linux-e2e runs every other one; a release's call runs every journey.
      all_journeys:
        description: Run every journey on the Mac, not only the tests that need a Mac
        required: false
        type: boolean
        default: false

# On demand on a task branch, a newer first-attempt request of the same
# selection replaces an older one, whatever exact version its ref names
# (INF-3380, the captain's direction A). A request on main, a rerun and a
# call keep a group of their own run: called by a release, verify belongs to
# that run alone and nothing outside it cancels it - a rehearsal of the same
# commit must never cancel a live release. (In a called workflow,
# github.workflow is the caller's name.)
# The Mac installer lane reads its caller's run through this token
# (mac-installer.yml, actions: read); nothing here writes.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow == 'verify' && github.ref != 'refs/heads/main' && github.run_attempt == '1' && format('verify-request-{0}-profile={1}-full_system={2}-mac_only={3}-installer_only={4}-installer_reuse={5}-perf={6}-all_journeys={7}-mac_runner={8}-linux_only={9}-native_runner={10}', github.ref, inputs.profile || 'stable', inputs.full_system, inputs.mac_only, inputs.installer_only, inputs.installer_reuse, inputs.perf, inputs.all_journeys, inputs.mac_runner, inputs.linux_only, inputs.native_runner) || format('verify-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.workflow == 'verify' }}

jobs:
  # Each job's name leads with the caller's trigger (scripts/ci-job-names.mjs).
  request:
    name: ${{ format('{0} · Check verification request', inputs.trigger || 'Manual request') }}
    runs-on: ${{ inputs.hosted && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').light || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Validate and record the manual request
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'verify' }}
          FULL_SYSTEM: ${{ inputs.full_system }}
          MAC_ONLY: ${{ inputs.mac_only }}
          LINUX_ONLY: ${{ inputs.linux_only }}
          INSTALLER_ONLY: ${{ inputs.installer_only }}
          INSTALLER_REUSE: ${{ inputs.installer_reuse }}
          SOURCE: ${{ inputs.ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          LEGACY_PRIVATE_PROJECT: ${{ github.repository == 'infinitary-labs/infinitary' }}
          TASK: ${{ inputs.task }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$LEGACY_PRIVATE_PROJECT" != true ] && [ "$INSTALLER_ONLY" = true ] && [ -z "$INSTALLER_REUSE" ]; then
            if [ "$WORKFLOW_REF" != refs/heads/main ] || [ "${SOURCE:-$WORKFLOW_SOURCE}" != "$WORKFLOW_SOURCE" ]; then
              echo 'Request fresh signed installer verification from main, using its exact commit.' >&2
              exit 1
            fi
          fi
          if [ "$MANUAL" != true ]; then exit 0; fi
          if [ "$INSTALLER_ONLY" = true ] || [ -n "$INSTALLER_REUSE" ]; then
            [ "$FULL_SYSTEM" != true ] && [ "$MAC_ONLY" != true ] && [ "$LINUX_ONLY" != true ] || { echo 'Choose installer verification, full-system, Mac-only or Linux-only, only one'; exit 1; }
          else
            chosen=0
            for choice in "$FULL_SYSTEM" "$MAC_ONLY" "$LINUX_ONLY"; do [ "$choice" != true ] || chosen=$((chosen + 1)); done
            [ "$chosen" -gt 0 ] || { echo 'Select full_system, mac_only or linux_only explicitly; use source-journeys.yml for the Linux journeys alone'; exit 1; }
            [ "$chosen" -eq 1 ] || { echo 'Choose full-system, Mac-only or Linux-only, only one'; exit 1; }
            [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] && [ -n "$TASK" ] && [ -n "$REASON" ] || {
              echo 'Full-system, Mac-only and Linux-only requests require an exact source commit, task and reason'; exit 1;
            }
          fi
          printf 'Verification request: full_system=%s mac_only=%s linux_only=%s installer_only=%s installer_reuse=%s source=%s task=%s reason=%s\n' "$FULL_SYSTEM" "$MAC_ONLY" "${LINUX_ONLY:-false}" "$INSTALLER_ONLY" "$INSTALLER_REUSE" "${SOURCE:-$WORKFLOW_SOURCE}" "$TASK" "$REASON" >> "$GITHUB_STEP_SUMMARY"
      # A by-hand request checks only a version a branch of this project holds
      # (docs/public-ci.md, "A check requested by hand"): GitHub hands out at
      # this project's address any commit a pull request holds, another copy's
      # included, and a request carries no pull request for the runners' fork
      # guard to see. Every other job here needs this job, so nothing checks the
      # version out before it passes. The same step opens each by-hand path
      # that checks out a named version; tests/requested-version.test.ts holds
      # them equal and runs it.
      - name: Check a branch of this project holds the requested version
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'verify'
        env:
          VERSION: ${{ inputs.ref }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          # The branches' and tags' commits alone: no file of any version, and
          # nothing more once fetched (GIT_NO_LAZY_FETCH), since GitHub would
          # hand out the named commit whoever holds it.
          [ -n "$VERSION" ] || exit 0
          git init --quiet "$RUNNER_TEMP/requested-version"
          cd "$RUNNER_TEMP/requested-version"
          git remote add origin "$SERVER/$REPOSITORY"
          # The sign-in reaches git in its environment, never its command line.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')" \
            git fetch --quiet --filter=tree:0 origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          export GIT_NO_LAZY_FETCH=1
          # The name as actions/checkout reads it: a full commit id, a branch
          # or tag by its full name, or a short name of a branch, else of a
          # tag. Any other full name, refs/pull/ among them, is no branch's.
          case "$VERSION" in
            refs/heads/*) commit="refs/remotes/origin/${VERSION#refs/heads/}" ;;
            refs/tags/*) commit="$VERSION" ;;
            [Rr][Ee][Ff][Ss]/*) commit= ;;
            *)
              if [[ "$VERSION" =~ ^[0-9a-fA-F]{40}$ ]]; then
                commit="$VERSION"
              elif git rev-parse --verify --quiet "refs/remotes/origin/$VERSION" > /dev/null; then
                commit="refs/remotes/origin/$VERSION"
              else
                commit="refs/tags/$VERSION"
              fi
              ;;
          esac
          holder=
          if [ -n "$commit" ]; then
            holder=$(git for-each-ref --contains "$commit" --count=1 --format='%(refname:lstrip=3)' refs/remotes/origin 2> /dev/null) || holder=
          fi
          if [ -z "$holder" ]; then
            echo "::error title=No branch holds the requested version::No branch of $REPOSITORY holds $VERSION, so this run checks nothing. A request checks only a version a branch of the project holds: push its branch, then request again. A pull request from another copy of the project runs its own checks on GitHub's machines (docs/public-ci.md, \"Outside contributors\")."
            exit 1
          fi
          echo "Branch $holder holds $VERSION."
  # linux-e2e: every Playwright journey on the app built from source on
  # Ubuntu (LINUX_RUNNER, hosted when unset), in shards (docs/testing.md, "The Linux source desktop").
  # A call from main.yml or release.yml runs them on GitHub's hosted Ubuntu instead.
  # Journeys that are the Mac's alone skip there and say why. The checks part
  # (main.yml's call) and a Mac-only request leave it out of the run.
  linux-e2e:
    needs: request
    if: ${{ !inputs.installer_only && !inputs.installer_reuse && !inputs.mac_only && inputs.part != 'checks' }}
    name: ${{ format('{0} · Linux journeys', inputs.trigger || 'Manual request') }}
    uses: ./.github/workflows/source-journeys.yml
    with:
      trigger: ${{ inputs.trigger || 'Manual request' }}
      ref: ${{ inputs.ref || github.ref }}
      hosted: ${{ inputs.hosted == true }}
      suite: full
  installer:
    needs: request
    name: ${{ format('{0} · Signed installer checks', inputs.trigger || 'Manual request') }}
    if: ${{ inputs.installer_only == true || inputs.installer_reuse != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mac-installer.yml
    with:
      trigger: ${{ inputs.trigger || 'Manual request' }}
      ref: ${{ inputs.ref || (github.repository == 'infinitary-labs/infinitary' && github.ref || github.sha) }}
      reuse: ${{ inputs.installer_reuse || '' }}
    # A called workflow reads its job environment's credentials only when its
    # caller hands its secrets on (docs/public-ci.md, "Release environments").
    secrets: inherit

  # The Linux automatic startup fixtures, which the swept batch runs in a job
  # of its own (batch-checks.yml), so a Linux-only request runs every Linux
  # job the batch does. Only that request runs them here; a call never does.
  startup:
    needs: request
    if: ${{ inputs.linux_only == true }}
    name: ${{ format('{0} · Linux startup', inputs.trigger || 'Manual request') }}
    uses: ./.github/workflows/linux-startup.yml
    with:
      trigger: ${{ inputs.trigger || 'Manual request' }}
      ref: ${{ inputs.ref }}

  # The profile's lanes, as one matrix: an omitted lane is absent from the
  # run, never a skipped job that reads as green. linux-checks is the main
  # checks' typecheck, lints and build in one job, beside linux-tests below,
  # which runs every vitest project. The macOS verification is three jobs of
  # one size (INF-2779, the captain's approved three-job split, so each Mac
  # place can take one and they run side by side): mac runs the Mac unit
  # files, the Claude client check, the replay gate and the package and
  # signing checks; parallel runs the journeys of the parallel lanes; desktop-1
  # and desktop-2 run the one-worker desktop lane in two groups of equal
  # measured time, each alone on its own Mac, with the recorded demos. The
  # parallel lanes' journeys are split between the parallel and mac jobs by
  # measured time, the mac job taking fewer for its own work, so the three
  # end together (INF-2987, scripts/journey-groups.ts); the journeys part,
  # with no mac job, runs them all in the parallel job. On GitHub's own Macs
  # (INF-6330's approved plan, option D), which run them about three times
  # slower, the parallel job is four, parallel-1 to parallel-4, so the mac
  # job and those four are five groups of about equal time; the desktop
  # groups stay on the project's Macs. Each step names the lanes it belongs
  # to. The journeys part runs the journey lanes alone, a Mac-only request
  # the Mac lanes, and a Linux-only request the code checks alone.
  lane:
    needs: request
    if: ${{ !inputs.installer_only && !inputs.installer_reuse }}
    # Each job's own group, which a merge batch's stop enters to cancel it
    # once the batch stops, and an alpha cut's stop once one of the cut's
    # jobs failed (release.yml's stop, scripts/batch-stop.mjs); nothing else
    # enters it.
    concurrency:
      group: ${{ format('batch-stop-{0}-{1}-verify-lane-{2}', github.run_id, github.run_attempt, matrix.lane) }}
    name: ${{ format('{0} · {1}', inputs.trigger || 'Manual request', matrix.lane == 'linux-checks' && 'Code checks and build (Linux)' || matrix.lane == 'mac' && 'Native tests, replay and package (Mac)' || matrix.lane == 'parallel' && 'Parallel journeys (Mac)' || startsWith(matrix.lane, 'parallel-') && format('Parallel journeys (Mac; group {0}/4)', matrix.lane == 'parallel-1' && 1 || matrix.lane == 'parallel-2' && 2 || matrix.lane == 'parallel-3' && 3 || 4) || format('Desktop journeys (Mac; group {0}/2)', matrix.lane == 'desktop-1' && 1 || 2)) }}
    strategy:
      fail-fast: false
      matrix:
        # The parallel journeys are four jobs when the mac and parallel lanes
        # run on GitHub's Macs, whose labels start macos-: the same label the
        # runs-on below gives those lanes.
        lane: ${{ fromJSON(format(inputs.part == 'journeys' && '[{0},"desktop-1","desktop-2"]' || inputs.mac_only && '["mac",{0},"desktop-1","desktop-2"]' || inputs.linux_only && '["linux-checks"]' || '["linux-checks","mac",{0},"desktop-1","desktop-2"]', startsWith(inputs.native_runner || fromJSON(vars.MAC_QUEUES || '{}').native || inputs.mac_runner || fromJSON(vars.MAC_QUEUES || '{}').split || fromJSON(vars.MAC_QUEUES || '{}').journeys || fromJSON(vars.MAC_QUEUES || '{}').check || vars.MAC_RUNNER || 'macos-15', 'macos-') && '"parallel-1","parallel-2","parallel-3","parallel-4"' || '"parallel"')) }}
    # Every Mac lane asks for the split kind, a size each Mac place can
    # take, so the lanes run side by side; until MAC_QUEUES names it, the
    # journeys kind's size, then the full check's old kind (docs/testing.md,
    # "Each Mac job's kind and size"). The mac and parallel lanes ask for the
    # native kind first, GitHub's Mac once MAC_QUEUES names it, even in a
    # batch or a release that names its own queue for the desktop lanes; a
    # request's native_runner comes before it, to measure a runner first.
    runs-on: ${{ matrix.lane == 'linux-checks' && (inputs.hosted && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').checks || vars.LINUX_RUNNER || 'ubuntu-24.04') || startsWith(matrix.lane, 'desktop-') && (inputs.mac_runner || fromJSON(vars.MAC_QUEUES || '{}').split || fromJSON(vars.MAC_QUEUES || '{}').journeys || fromJSON(vars.MAC_QUEUES || '{}').check || vars.MAC_RUNNER || 'macos-15') || inputs.native_runner || fromJSON(vars.MAC_QUEUES || '{}').native || inputs.mac_runner || fromJSON(vars.MAC_QUEUES || '{}').split || fromJSON(vars.MAC_QUEUES || '{}').journeys || fromJSON(vars.MAC_QUEUES || '{}').check || vars.MAC_RUNNER || 'macos-15' }}
    # Every crewmate works under "Application Support". The gate here does
    # too, so a check that only fails from a path with a space fails here
    # instead of only in a working copy (FI3-152).
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      # The shared action has to be on disk before it can run, and this job's
      # default working directory does not exist until the real checkout.
      # Fetch only that action, start the assertion, then check out the tree
      # the rest of the job runs in. The assertion is .github/actions/keep-mac-awake
      # (also used by the signing job); it is not copied here.
      # A refused checkout waits until GitHub takes the job's token again,
      # then runs once more (docs/testing.md, "GitHub refusing a job's token"),
      # from the runner's temporary folder, since the default one may not exist.
      - id: awake-checkout
        name: Checkout the keep-awake action
        if: matrix.lane != 'linux-checks'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &lane-awake-checkout
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: .github/actions/keep-mac-awake
          fetch-depth: 1
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.awake-checkout.outcome == 'failure' }}
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ github.token }}
        run: &wait-for-token |
          # Asks the address the checkout's fetch reads, with the job's token
          # as the checkout sends it, every 15 seconds for up to 10 minutes,
          # then lets the checkout try once more. A failure GitHub's token
          # did not cause, such as a missing commit, is tried again at once.
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/info/refs?service=git-upload-pack"
          patience="${CHECKOUT_PATIENCE_SECONDS:-600}"
          pause="${CHECKOUT_PAUSE_SECONDS:-15}"
          started=$SECONDS
          while :; do
            # The token reaches curl on its input, never on its command line.
            answer="$(printf 'user = "x-access-token:%s"\n' "$TOKEN" |
              curl --silent --location --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 30 --max-time 60 --config - --url "$url")" || true
            if [[ "$answer" == 2?? ]]; then exit 0; fi
            waited=$((SECONDS - started))
            if ((waited >= patience)); then
              echo "::warning title=GitHub still refuses the job's token::It answered $answer after ${waited}s; the checkout tries once more."
              exit 0
            fi
            echo "GitHub answered $answer to the job's token after ${waited}s; asking again in ${pause}s"
            sleep "$pause"
          done
      - name: Checkout the keep-awake action again
        if: ${{ !cancelled() && steps.awake-checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *lane-awake-checkout
      - name: Keep the Mac awake
        if: matrix.lane != 'linux-checks'
        uses: ./.github/actions/keep-mac-awake
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &lane-checkout
          ref: ${{ inputs.ref || github.ref }}
          path: Application Support/firstmate
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *lane-checkout
      - uses: ./Application Support/firstmate/.github/actions/pnpm
        with:
          working-directory: Application Support/firstmate
      # No package cache on a Mac lane (journeys.yml says why, INF-724).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ matrix.lane == 'linux-checks' && runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: Application Support/firstmate/pnpm-lock.yaml
      - uses: ./Application Support/firstmate/.github/actions/node-headers
        with:
          working-directory: Application Support/firstmate
      - uses: ./Application Support/firstmate/.github/actions/electron-download
        with:
          working-directory: Application Support/firstmate
          # The universal package below reads both Mac zips.
          zips: ${{ matrix.lane == 'mac' && 'darwin-arm64 darwin-x64' || '' }}
      - id: install
        run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - uses: ./Application Support/firstmate/.github/actions/prove-node-headers
        if: matrix.lane == 'linux-checks'
        with:
          working-directory: Application Support/firstmate
      # Each later stage waits only on the stages it needs, never on every
      # stage before it: !cancelled() lets it run after an unrelated failure,
      # and its inputs' outcomes keep it from running on a broken one. So one
      # red stage leaves every independent stage's result on the run, and the
      # job still ends red on any failure, which keeps release.yml from signing.
      #
      # linux-checks: the typecheck, lints and build of ci.yml's jobs, in one
      # job on hosted Linux; linux-tests runs their tests. Each needs only the
      # install; its build is the shared one below.
      - if: ${{ !cancelled() && matrix.lane == 'linux-checks' && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && matrix.lane == 'linux-checks' && steps.install.outcome == 'success' }}
        run: pnpm check
      - if: ${{ !cancelled() && matrix.lane == 'linux-checks' && steps.install.outcome == 'success' }}
        run: pnpm lint:adherence
      # linux-tests runs every Vitest file on Linux, every probe included. Mac repeats
      # only files with Mac-specific cases/readings; keep mixed files whole so
      # none of their Mac-only cases is lost (scripts/mac-unit-tests.ts).
      - name: Read the temporary volume's filesystem type
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        run: node -e 'console.log(require("fs").statfsSync(require("os").tmpdir()).type)'
      # The native run-root regression includes the real Vitest browser.
      - uses: ./Application Support/firstmate/.github/actions/browser-chromium
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        with:
          working-directory: Application Support/firstmate
      - id: unit
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          mac_tests="$(node scripts/mac-unit-tests.ts)"
          pnpm test $mac_tests
      # The app built in every lane: each lane is a machine of its own, and
      # its install and build take seconds beside a hand-over between jobs
      # (INF-724). The journeys and the package smoke run on it.
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      # Playwright's window recorder is not part of an install. A journey that
      # records would otherwise fetch it in the middle of its test, and where
      # the fetch fails the window never reports itself loaded.
      - id: recorder
        if: ${{ !cancelled() && (matrix.lane == 'mac' || startsWith(matrix.lane, 'parallel') || startsWith(matrix.lane, 'desktop-')) && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install ffmpeg
      # The pinned encoder a demo journey records with, from the Actions cache.
      - if: ${{ !cancelled() && (matrix.lane == 'mac' || startsWith(matrix.lane, 'parallel') || startsWith(matrix.lane, 'desktop-')) && steps.install.outcome == 'success' }}
        uses: ./Application Support/firstmate/.github/actions/demo-encoder
        with:
          working-directory: Application Support/firstmate
      # The signature the journeys below run on, read from the binary itself:
      # Electron's own, never this runner's local development identity. A
      # report, never a gate.
      - name: Read the dev Electron's signature
        if: ${{ !cancelled() && (matrix.lane == 'mac' || startsWith(matrix.lane, 'parallel') || startsWith(matrix.lane, 'desktop-')) && steps.install.outcome == 'success' }}
        run: codesign -dvv "$(node -p 'require("electron")')" 2>&1 | grep -E '^(Identifier|Authority|Signature|TeamIdentifier|CDHash)=' || true
      # The desktop suite, on the build above and Electron's supplied
      # signature, one journey lane per job, as the Linux journeys run
      # (source-journeys.yml): parallel and mac each take a group of the
      # styles, renderer and application lanes, of measured time balanced
      # with the mac job's own work (scripts/journey-groups.ts; a group with
      # no file runs nothing, and one whose files hold no test of the tag
      # passes), and desktop the one-worker lane, alone on its machine;
      # --no-deps keeps desktop, the other lanes' teardown, out of the
      # parallel groups (tests/e2e/lanes.ts). Every journey runs when
      # all_journeys is set: every alpha. A requested check runs only the
      # tests tagged MAC_ONLY_TAG (tests/e2e/tags.ts), since linux-e2e runs
      # every other one (docs/principles.md, 2026-10-28), and so does the run
      # on main, which leaves every other journey to the release (INF-2480).
      # The tag goes to every lane through INFINITARY_E2E_TAG
      # (playwright.config.ts), never --grep.
      # A local run keeps its JSON result in its own run directory
      # (tests/e2e/runEvidence.ts); this one names the fixed path kept below.
      # The parallel lanes take half the job's cores: its size when the
      # placement service names one, else this Mac's, so a job beside it keeps
      # its share. With every processor, launches starved while the other
      # slot ran journeys too (docs/testing.md, "E2E scheduling"). A GitHub
      # Mac is a machine of its own job alone, so there they take every core
      # but one. GitHub's Macs balance by their own measured times.
      - id: e2e
        name: Run this job's journeys
        if: ${{ !cancelled() && (matrix.lane == 'mac' || startsWith(matrix.lane, 'parallel') || startsWith(matrix.lane, 'desktop-')) && steps.build.outcome == 'success' && steps.recorder.outcome == 'success' }}
        # The run ends at 150 minutes and the command at 180 (INF-1083, the
        # captain's check limits); a stuck wait ends sooner, at its own cap.
        timeout-minutes: 180
        run: |
          cores="$(node scripts/job-cores.ts)"
          platform=mac
          workers="--workers=$(( cores > 1 ? cores / 2 : 1 ))"
          if [ "$RUNNER_KIND" = github-hosted ]; then
            platform=mac-hosted
            workers="--workers=$(( cores > 1 ? cores - 1 : 1 ))"
          fi
          if [ "${LANE#desktop-}" != "$LANE" ]; then
            node scripts/journey-groups.ts --platform "$platform" --lane desktop --group "${LANE#desktop-}/2" -- --no-deps --project=desktop "$workers"
          else
            # The parallel jobs' groups come first, in their order, and the
            # mac job's last. On GitHub's Macs the parallel jobs are four
            # (parallel-1 to parallel-4) and the mac job is there too, since
            # one runs-on label sends both; elsewhere one, parallel.
            parallel=1
            [ "$LANE" = parallel ] || [ "$platform" = mac ] || parallel=4
            case "$LANE" in
              parallel) index=1 ;;
              parallel-*) index="${LANE#parallel-}" ;;
              *) index=$((parallel + 1)) ;;
            esac
            if [ "$PART" = journeys ]; then
              # No mac job: the parallel jobs take every group.
              group="$index/$parallel"
              jobs=
            else
              group="$index/$((parallel + 1))"
              jobs="--jobs $(printf 'parallel,%.0s' $(seq "$parallel"))mac"
            fi
            # shellcheck disable=SC2086 # one word per job name
            node scripts/journey-groups.ts --platform "$platform" --lane parallel --group "$group" $jobs -- --no-deps --project=styles --project=renderer --project=application "$workers" --pass-with-no-tests
          fi
        env:
          LANE: ${{ matrix.lane }}
          PART: ${{ inputs.part }}
          RUNNER_KIND: ${{ runner.environment }}
          INFINITARY_E2E_TAG: ${{ !inputs.all_journeys && '@mac-only' || '' }}
          INFINITARY_E2E_RUN_MINUTES: 150
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/e2e-results.json
      # What the e2e run leaves for whoever reads it (docs/testing.md):
      # Playwright's machine-readable result whenever the suite ran, and on a
      # failure every result directory - each failed journey's error context
      # (the error and the app's accessibility snapshot), its trace and its
      # screenshot. Each app ran on a throwaway userData and HOME and no step
      # of this job holds a secret; a trace records the launch environment's
      # shape, never its values. Neither upload can fail the job, and neither
      # runs when an earlier stage kept e2e from starting. Each journey lane
      # keeps its own, named for its lane.
      # Only a run of every journey keeps its results as e2e-results-<lane>,
      # the journey times journeys.yml's chooser reads.
      - name: Keep the e2e result
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('{0}-{1}', inputs.all_journeys && 'e2e-results' || 'e2e-results-mac-only', matrix.lane) }}
          path: Application Support/firstmate/playwright-report/e2e-results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the failed journeys' evidence
        if: ${{ always() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('e2e-failures-{0}', matrix.lane) }}
          path: Application Support/firstmate/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # The demos a journey recorded (tests/e2e/demo.ts, docs/testing.md
      # "Recording a demo"), passed or failed, so a requested demo can be
      # watched from the run's page. Only a journey that asks records, and
      # each such journey is in the desktop lane (tests/e2e-lanes.test.ts).
      - name: Keep the recorded demos
        if: ${{ always() && startsWith(matrix.lane, 'desktop-') && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('e2e-demos-{0}', matrix.lane) }}
          path: Application Support/firstmate/test-results/runs/*/*/demo/
          if-no-files-found: ignore
          retention-days: 14
      # The budgets the suite above only reported, graded (tests/e2e/perf.ts),
      # in the first desktop job, which runs every tagged file whichever group
      # holds it, after its own journeys. Whole files, because a serial
      # spec's later tests stand on its earlier ones; --no-deps, because the
      # desktop lane is the other lanes' teardown and a teardown project
      # ignores the file filter.
      - id: perf
        if: ${{ !cancelled() && inputs.perf && matrix.lane == 'desktop-1' && steps.e2e.outcome != 'skipped' }}
        run: |
          grep -lE "tag: .*PERF_TAG" tests/e2e/*.spec.ts | xargs pnpm exec playwright test --no-deps
        env:
          INFINITARY_PERF_BUDGETS: "1"
          # Its own result file: the one the summary reads stays the suite's.
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/perf-results.json
      # The Claude transport runs the client the machine has installed and the
      # app ships none (F14), so a release has to prove today's client still
      # serves the tool surface the source declares, and adds to the Firstmate
      # seat only the attachments docs/claude-client.md accepts
      # (claudeToolSurface.test.ts otherwise runs against the SDK's own
      # copy). A runner that has a client - a self-hosted one is somebody's
      # own Mac - is captured against that client exactly as installed, never
      # updated or replaced from here; only a runner with none gets one the
      # way a person does, from the vendor's native installer.
      - id: claude-client
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        run: |
          claude_bin="$(command -v claude || true)"
          if [ -z "$claude_bin" ] && [ -x "$HOME/.local/bin/claude" ]; then claude_bin="$HOME/.local/bin/claude"; fi
          if [ -z "$claude_bin" ]; then
            curl -fsSL https://claude.ai/install.sh | bash
            claude_bin="$HOME/.local/bin/claude"
          fi
          test -x "$claude_bin" || { echo "::error title=Claude Code missing::no installed client, and the native installer left none at ~/.local/bin/claude"; exit 1; }
          "$claude_bin" --version
          INFINITARY_CLAUDE_CLI="$claude_bin" pnpm exec vitest run src/core/claude/claudeToolSurface.test.ts
      # The interaction eval gate (docs/replay-harness.md): replays the
      # committed captain sessions and fails on any metric that regressed
      # from tests/fixtures/replay/baseline.json.
      - id: replay
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        run: pnpm replay:gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.lane == 'mac'
        with:
          name: replay-report
          path: Application Support/firstmate/replay-report.json
          if-no-files-found: ignore
      # The signing proof, on a machine where no stage launches the dev
      # Electron: the journeys are isolated source tests on Electron's
      # supplied signature, in jobs of their own that never sign, so a signing
      # failure stops none of them (docs/testing.md, "Platform and signing are
      # separate").
      # An install never signs (docs/local-code-signing.md), so the lane signs
      # the dev Electron here, the way `pnpm dev` does on a person's Mac; the
      # package below is its own copy, signed through the same identity, and
      # the codesign stage checks both. A red signing stage still ends the job red.
      - id: dev-signing
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.install.outcome == 'success' }}
        run: pnpm codesign:local
      # electron-builder refuses to sign pull-request builds by default, which
      # would skip the one step this smoke exists for: the fuse-flipped
      # binary has to be re-signed or Apple Silicon SIGKILLs it at exec, and
      # an outside contributor's pull request calls this workflow
      # (contributors.yml), so the flag keeps the smoke signing there. The flag's usual security
      # concern is a fork reaching a stored certificate; there is none here -
      # `pnpm codesign:local` generated this runner's own local certificate
      # (docs/local-code-signing.md) and it dies with the runner.
      #
      # electron-builder downloads both Mac zips the universal package reads,
      # and Electron's SHASUMS256.txt for each, from GitHub's release server:
      # main's check run 42463836430 failed on a 504 there. The zips come
      # from the cache the Electron download step restored, each checked
      # against Electron's bundled checksums first
      # (.github/actions/electron-download/zips.mjs), so electron-builder
      # reads them there and downloads no checksum file.
      - id: package
        name: Package the universal app
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.build.outcome == 'success' && steps.dev-signing.outcome == 'success' }}
        run: |
          node .github/actions/electron-download/zips.mjs darwin arm64 x64
          pnpm exec electron-builder --mac dir --universal --config electron-builder.dev.yml \
            -c.electronDownload.cache="$electron_config_cache" -c.electronDownload.isVerifyChecksum=false
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - id: codesign
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.package.outcome == 'success' }}
        run: pnpm codesign:verify
      # The local dev bundle is the dev flavor: it must open
      # <appData>/infinitary-dev, never the installed release's folder
      # (src/shared/userDataFolders.ts). The release's own folder is checked
      # on the signed app in release.yml.
      - id: data-folder
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.package.outcome == 'success' }}
        run: scripts/check-user-data-dir.sh "dist/mac-universal/Infinitary Dev.app" infinitary-dev
      # The app's own git (docs/forge.md): both architectures ship, and the
      # runner's answers through the directory a crewmate's shell runs it
      # from, with no search path at all.
      - id: bundled-git
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.package.outcome == 'success' }}
        run: scripts/check-bundled-git.sh "dist/mac-universal/Infinitary Dev.app"
      # The app runs work for another Mac with no window (docs/helper.md):
      # started as `<app> work`, on the runner's own architecture and on
      # Intel through Rosetta when the runner has it.
      - id: helper
        if: ${{ !cancelled() && matrix.lane == 'mac' && steps.package.outcome == 'success' }}
        run: scripts/check-helper.sh "dist/mac-universal/Infinitary Dev.app"
      # The run's page says what a red verify needs first (docs/testing.md):
      # the exact commit it checked, the first stage that failed, and, in a
      # journey lane, the e2e counts, skipped included, with every failure in
      # the order it started and the first one's assertion. It reads the
      # stages' typed outcomes and Playwright's JSON result, never the log's
      # prose, and it decides nothing about which failure caused which - that
      # stays with whoever reviews the evidence. A report, never a gate.
      - name: Summarize
        if: always() && matrix.lane != 'linux-checks'
        continue-on-error: true
        env:
          REQUESTED: ${{ inputs.ref || github.ref }}
          LANE: ${{ matrix.lane }}
          STAGES: >-
            install=${{ steps.install.outcome }}
            unit=${{ steps.unit.outcome }}
            build=${{ steps.build.outcome }}
            recorder=${{ steps.recorder.outcome }}
            e2e=${{ steps.e2e.outcome }}
            perf=${{ steps.perf.outcome }}
            claude-client=${{ steps.claude-client.outcome }}
            replay=${{ steps.replay.outcome }}
            dev-signing=${{ steps.dev-signing.outcome }}
            package=${{ steps.package.outcome }}
            codesign=${{ steps.codesign.outcome }}
            data-folder=${{ steps.data-folder.outcome }}
            bundled-git=${{ steps.bundled-git.outcome }}
            helper=${{ steps.helper.outcome }}
        run: |
          first_failed=none
          for stage in $STAGES; do
            if [ "${stage#*=}" = failure ] && [ "$first_failed" = none ]; then first_failed="${stage%%=*}"; fi
          done
          {
            echo "### verify of \`$REQUESTED\` at \`$(git rev-parse HEAD)\`"
            echo
            echo "First failed stage: **$first_failed**. Stages: \`$STAGES\`."
            echo
            if [ "$LANE" != mac ] || [ -f playwright-report/e2e-results.json ]; then
              node - <<'SUMMARY'
          const fs = require("node:fs");
          const file = "playwright-report/e2e-results.json";
          if (!fs.existsSync(file)) {
            console.log("No e2e result: the suite did not run to its end.");
            process.exit(0);
          }
          const plain = (text) => String(text ?? "").replace(/\u001b\[[0-9;]*m/g, "");
          // Playwright reports where an assertion failed by its real path.
          const here = (path) => (path ?? "").replace(`${fs.realpathSync(process.cwd())}/`, "");
          const report = JSON.parse(fs.readFileSync(file, "utf8"));
          const stats = report.stats ?? {};
          console.log(
            `E2E: ${stats.expected ?? 0} passed, ${stats.unexpected ?? 0} failed, ` +
              `${stats.flaky ?? 0} flaky, ${stats.skipped ?? 0} skipped or not run.`,
          );
          const failed = [];
          const visit = (suite, titles) => {
            for (const spec of suite.specs ?? [])
              for (const test of spec.tests ?? [])
                if (test.status === "unexpected")
                  for (const result of test.results ?? [])
                    if (result.status !== "passed" && result.status !== "skipped")
                      failed.push({
                        name: [...titles, spec.title].join(" › "),
                        where: `${spec.file}:${spec.line}`,
                        lane: test.projectName,
                        startedAt: Date.parse(result.startTime),
                        error: result.errors?.[0] ?? result.error ?? {},
                      });
            for (const child of suite.suites ?? []) visit(child, [...titles, child.title]);
          };
          for (const suite of report.suites ?? []) visit(suite, []);
          failed.sort((a, b) => a.startedAt - b.startedAt);
          const [first] = failed;
          if (first) {
            const at = first.error.location;
            console.log(
              `\nFirst to fail: **${first.name}** (\`${first.where}\`, ${first.lane})` +
                (at ? `, at \`${here(at.file)}:${at.line}\`` : ""),
            );
            console.log(["```", ...plain(first.error.message).split("\n").slice(0, 12), "```"].join("\n"));
            console.log("\nEvery failure, in the order it started:");
            for (const failure of failed)
              console.log(`- \`${failure.where}\` ${failure.name} (${failure.lane})`);
          }
          for (const error of report.errors ?? [])
            console.log(`\nOutside any test: ${plain(error.message).split("\n")[0]}`);
          SUMMARY
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # linux-tests: every vitest project on Linux, in test groups on machines of
  # their own, each a numbered set of vitest's own --shard (a hash of each
  # file's path) or one whole group (INF-2646, the captain's approved split:
  # on GitHub's hosted two-processor Ubuntu the whole suite ran past its
  # limit in one job). Together the groups run every project and every
  # probe, the projects ci.yml's requested sweeps run (docs/test-cohorts.md);
  # the alpha's proof requires every group's complete set
  # (scripts/main-alpha-proof.mjs). Each group reports even when another
  # fails, and the journeys part and a Mac-only request leave them out, as
  # linux-checks.
  linux-tests:
    needs: request
    if: ${{ !inputs.installer_only && !inputs.installer_reuse && !inputs.mac_only && inputs.part != 'journeys' }}
    # Each group's own, for a merge batch's or an alpha cut's stop, as the lanes above.
    concurrency:
      group: ${{ format('batch-stop-{0}-{1}-verify-tests-{2}-{3}', github.run_id, github.run_attempt, matrix.tests, matrix.shard) }}
    name: ${{ format(matrix.shards > 1 && '{0} · {1} (Linux; group {2}/{3})' || '{0} · {1} (Linux)', inputs.trigger || 'Manual request', matrix.tests, matrix.shard, matrix.shards) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tests: Unit tests
            projects: --project pure --project unit --project unit-isolated
            shard: 1
            shards: 3
          - tests: Unit tests
            projects: --project pure --project unit --project unit-isolated
            shard: 2
            shards: 3
          - tests: Unit tests
            projects: --project pure --project unit --project unit-isolated
            shard: 3
            shards: 3
          # The run-root regression starts real Chromium in this cohort.
          - tests: Integration tests
            projects: --project integration
            shard: 1
            shards: 2
            chromium: true
          - tests: Integration tests
            projects: --project integration
            shard: 2
            shards: 2
            chromium: true
          # Probes can fail with no code change (docs/test-cohorts.md, "Probes"):
          # every one runs, across both groups, never a changed-path selection.
          - tests: Environment checks
            projects: --project probe
            shard: 1
            shards: 2
          - tests: Environment checks
            projects: --project probe
            shard: 2
            shards: 2
          # The browser layer, on the Chromium it installs (docs/testing.md, "The browser layer").
          - tests: Browser tests
            projects: --project browser
            shard: 1
            shards: 1
            chromium: true
    runs-on: ${{ inputs.hosted && (inputs.fleet_tests && vars.LINUX_RUNNER || 'ubuntu-24.04') || fromJSON(vars.LINUX_QUEUES || '{}').checks || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # Under "Application Support", as the lanes above (FI3-152).
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &linux-tests-checkout
          ref: ${{ inputs.ref || github.ref }}
          path: Application Support/firstmate
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *linux-tests-checkout
      - uses: ./Application Support/firstmate/.github/actions/pnpm
        with:
          working-directory: Application Support/firstmate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: Application Support/firstmate/pnpm-lock.yaml
      - uses: ./Application Support/firstmate/.github/actions/node-headers
        with:
          working-directory: Application Support/firstmate
      - uses: ./Application Support/firstmate/.github/actions/electron-download
        with:
          working-directory: Application Support/firstmate
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - uses: ./Application Support/firstmate/.github/actions/browser-chromium
        if: matrix.chromium
        with:
          working-directory: Application Support/firstmate
      # A requested source may predate this action. Keep the test checkout pinned
      # and fetch only the prerequisites from the version that owns this workflow.
      - id: linux-test-tools-checkout
        name: Check out Linux integration test tools
        if: matrix.tests == 'Integration tests'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &linux-test-tools-checkout
          ref: ${{ github.workflow_sha }}
          path: .verify-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/linux-test-tools/
            scripts/apt-install.sh
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.linux-test-tools-checkout.outcome == 'failure' }}
        working-directory: ${{ runner.temp }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out Linux integration test tools again
        if: ${{ !cancelled() && steps.linux-test-tools-checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *linux-test-tools-checkout
      - uses: ./.verify-tooling/.github/actions/linux-test-tools
        if: matrix.tests == 'Integration tests'
        with:
          working-directory: .verify-tooling
      # A stuck test ends sooner, by its own cap (ci.yml says why); the longest
      # group takes about a fifth of this limit on a hosted machine.
      - run: pnpm test $PROJECTS --shard="$SHARD/$SHARDS"
        # shellcheck disable=SC2086 # one word per project flag
        timeout-minutes: 60
        env:
          PROJECTS: ${{ matrix.projects }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          # Test time limits run on the load clock, and on the wall clock only on a graded run (docs/test-cohorts.md, "Budgets").
          INFINITARY_PERF_BUDGETS: ${{ inputs.perf && '1' || '' }}
          # Also writes each file's time, which the next step keeps (vitest.config.ts).
          INFINITARY_TEST_TIMING_FILE: vitest-timing.json
      # The measured time of each file, which scripts/shard-timings.ts turns into
      # the record the unit groups are balanced by (docs/test-cohorts.md, "Balanced groups").
      - name: Keep the test times
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('vitest-timing-{0}-{1}-of-{2}', matrix.tests, matrix.shard, matrix.shards) }}
          path: Application Support/firstmate/vitest-timing.json
          if-no-files-found: ignore
          retention-days: 14

  # A merge batch's confirm of each Linux test group (docs/testing.md, "The
  # swept batch"; INF-4382): once the test groups ended and one failed, each
  # group's own confirm reads that group's failed job's log for the test files
  # it names as failed (scripts/batch-failures.mjs) and runs them three rounds
  # on the same version on hosted Linux (.github/actions/batch-confirm), while
  # the journeys and the Mac lanes run on. A group that did not fail passes
  # it; a failed group whose log names no test file fails it. Only the swept
  # batch's call asks for it, and its failures job leaves the jobs these took
  # out of the later confirm. Each group is named as linux-tests names it.
  linux-tests-confirm:
    needs: linux-tests
    if: ${{ !cancelled() && inputs.confirm && needs.linux-tests.result == 'failure' }}
    name: ${{ format('{0} · Confirm failed {1}', inputs.trigger || 'Manual request', matrix.group) }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - Unit tests (Linux; group 1/3)
          - Unit tests (Linux; group 2/3)
          - Unit tests (Linux; group 3/3)
          - Integration tests (Linux; group 1/2)
          - Integration tests (Linux; group 2/2)
          - Environment checks (Linux; group 1/2)
          - Environment checks (Linux; group 2/2)
          - Browser tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # A refused checkout waits until GitHub takes the job's token again,
      # then runs once more (docs/testing.md, "GitHub refusing a job's token").
      - id: reader-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &confirm-reader-checkout
          ref: ${{ inputs.ref || github.ref }}
          # The failure reader and the job names it reads the run by.
          sparse-checkout: |
            scripts/batch-failures.mjs
            scripts/batch-pull.mjs
          sparse-checkout-cone-mode: false
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.reader-checkout.outcome == 'failure' }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.reader-checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *confirm-reader-checkout
      - id: read
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          GROUP: ${{ matrix.group }}
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {groupFailure} = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/batch-failures.mjs`).href);
            await groupFailure({github, context, core, group: process.env.GROUP});
      - if: steps.read.outputs.found == 'unanswerable'
        env:
          GROUP: ${{ matrix.group }}
        run: |
          echo "::error title=No failed test file::The $GROUP job's log named no failed test file, so nothing runs again and the batch's check stays failed."
          exit 1
      - id: checkout
        if: steps.read.outputs.found == 'confirm'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &confirm-checkout
          ref: ${{ inputs.ref || github.ref }}
          path: Application Support/firstmate
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *confirm-checkout
      - if: steps.read.outputs.found == 'confirm'
        uses: ./Application Support/firstmate/.github/actions/batch-confirm
        with:
          files: ${{ steps.read.outputs.files }}
          platform: linux
          artifact: ${{ format('confirm-failures-linux-{0}', strategy.job-index) }}
